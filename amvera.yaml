meta:
  environment: node
  toolchain:
    name: npm
    version: 24

build:
  additionalCommands: npm ci && npm run build

run:
  command: npm run start
  containerPort: 3000
  # Включаем режим развертывания без простоя
  zeroDowntime: true
  # Разрешаем запуск нескольких экземпляров (обязательно для zeroDowntime)
  singleton: false
  # Указываем папку для постоянного хранилища (опционально)
  persistenceMount: /data

deploy:
  ignore:
    - node_modules/
    - .next/
    - .git/